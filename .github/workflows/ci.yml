name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh initdb/*.sh
      - name: Prepare env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose --profile restore config -q
      - name: Start cluster
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Replication smoke test
        run: bash scripts/smoke-test.sh
      - name: Backup and point-in-time restore test
        run: bash scripts/restore-test.sh
      - name: Replication status
        run: bash scripts/status.sh
      - name: Failover drill
        run: bash scripts/failover-drill.sh
      - name: Logs on failure
        if: failure()
        run: docker compose --profile restore logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile restore down -v
